name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_site:
        description: Also verify the already-deployed todo.muquew.com site against this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install accessibility dependency
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Validate static files, dates, and browser workflows
        run: python tools/check.py --report dist/check-results.json
      - name: Summarize check program outcomes
        if: always()
        run: |
          python - <<'PY'
          import json, math, os, re
          from pathlib import Path

          checks, planned, status, report = [], None, 'missing', {}
          try:
              path = Path('dist/check-results.json')
              if path.is_symlink() or path.stat().st_size > 2_000_000:
                  raise ValueError
              report = json.loads(path.read_text(encoding='utf-8'))
              checks, planned = report['checks'], report['planned_checks']
              if not isinstance(checks, list) or not isinstance(planned, list):
                  raise ValueError
              status = report.get('status', 'invalid')
              if status not in {'initializing', 'running', 'passed', 'failed', 'interrupted', 'error'}:
                  status = 'invalid'
          except FileNotFoundError:
              pass
          except (OSError, ValueError, TypeError, KeyError):
              checks, planned, status, report = [], None, 'invalid', {}

          known = {path.name for path in Path('tools').glob('*.py')
                   if re.fullmatch(r'[a-z][a-z0-9_]{0,79}\.py', path.name)}
          rows, all_zero = [], True
          for item in checks[:100]:
              item = item if isinstance(item, dict) else {}
              program = item.get('program')
              name = Path(program).name if isinstance(program, str) else ''
              name = name if name in known else 'unknown-program'
              code = item.get('exit_code')
              valid_code = type(code) is int and -255 <= code <= 255
              duration = item.get('duration_seconds')
              valid_duration = type(duration) in (int, float) and 0 <= duration <= 86400 and math.isfinite(duration)
              shown_duration = f'{duration:.3f}s' if valid_duration else 'unknown'
              rows.append(f'| `{name}` | {code if valid_code else "unknown"} | {shown_duration} |')
              all_zero = all_zero and valid_code and code == 0 and name != 'unknown-program'
              if valid_code and code != 0:
                  print(f'::error::{name} exit={code}')
          if status == 'passed' and not (report.get('completed') is True and report.get('passed') is True
                  and planned and len(checks) == len(planned) and len(checks) <= 100 and all_zero):
              status = 'incomplete'
          count = f'{len(checks)}/{len(planned)}' if planned is not None else '0/unknown'
          lines = ['## Check program outcomes', '', f'Status: {status}. Executed/planned: {count}.', '',
                   '| Program | Exit | Duration |', '| --- | ---: | ---: |', *rows]
          if len(checks) > 100:
              lines += ['', 'Only the first 100 executed programs are shown.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Locate a failed smoke assertion with public source metadata
        if: failure()
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          try:
              path = Path('dist/check-results.json')
              if path.is_symlink() or path.stat().st_size > 2_000_000:
                  raise ValueError
              checks = json.loads(path.read_text(encoding='utf-8'))['checks']
              failed = isinstance(checks, list) and any(isinstance(item, dict)
                  and item.get('program') == 'smoke_playwright.py'
                  and type(item.get('exit_code')) is int and -255 <= item['exit_code'] <= 255
                  and item['exit_code'] != 0 for item in checks)
          except (OSError, ValueError, TypeError, KeyError):
              failed = False
          if not failed:
              raise SystemExit(0)

          tools = Path('tools').resolve()
          known = {path.name for path in tools.glob('*.py')
                   if re.fullmatch(r'[a-z][a-z0-9_]{0,79}\.py', path.name)}
          def identifier(value):
              return value if re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]{0,79}', value) else 'unknown'
          def outcome(phase, error=None):
              if error is None:
                  print(f'::notice::{phase} pass')
                  return
              kind = identifier(type(error).__name__)
              location, frame = None, error.__traceback__
              while frame is not None:
                  code = frame.tb_frame.f_code
                  source = Path(code.co_filename).resolve()
                  if source.parent == tools and source.name in known and 0 < frame.tb_lineno <= 1_000_000:
                      location = (source.name, frame.tb_lineno, identifier(code.co_name))
                  frame = frame.tb_next
              if location is None:
                  print(f'::error::{phase} fail {kind} source=unavailable')
              else:
                  name, line, function = location
                  print(f'::error file=tools/{name},line={line}::{phase} fail {kind} {name}:{line}:{function}')

          sys.path.insert(0, str(tools))
          try:
              import smoke_playwright as smoke
              from playwright.sync_api import sync_playwright
          except Exception as error:
              outcome('smoke_setup', error)
              raise

          key = 'TASK_TRACER_BROWSER_EXECUTABLE'
          present, saved = key in os.environ, os.environ.get(key)
          def restore():
              if present:
                  os.environ[key] = saved
              else:
                  os.environ.pop(key, None)
          try:
              smoke.ensure_conda_library_path()
              with smoke.local_server() as url, sync_playwright() as playwright:
                  for phase, executable in [('pwa_default', None), ('pwa_full', playwright.chromium.executable_path)]:
                      try:
                          if executable is None:
                              os.environ.pop(key, None)
                          else:
                              os.environ[key] = executable
                          smoke.assert_installability_in_regular_profile(playwright, url)
                      except Exception as error:
                          outcome(phase, error)
                      else:
                          outcome(phase)
                      finally:
                          restore()
          except Exception as error:
              outcome('pwa_setup', error)
          finally:
              restore()
          try:
              smoke.ensure_conda_library_path()
              with smoke.local_server() as url:
                  smoke.smoke(url)
          except Exception as error:
              outcome('smoke_default', error)
              raise
          else:
              outcome('smoke_default')
          PY
      - name: Retain program outcomes even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-check-results
          path: dist/check-results.json
          if-no-files-found: warn
      - name: Build verified static distribution
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: task-tracer-static
          path: dist/
          if-no-files-found: error

  compatibility:
    if: ${{ github.ref != 'refs/heads/codex/ci-outcome-summary-20261026' && github.head_ref != 'codex/ci-outcome-summary-20261026' }}
    runs-on: ubuntu-latest
    # Hosted WebKit exceeded 45 minutes; retain its complete workflow registry.
    timeout-minutes: ${{ matrix.browser == 'webkit' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install target browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Validate critical workflows on desktop and mobile layouts
        run: python tools/browser_matrix.py --browser ${{ matrix.browser }} --keep-going --report dist/browser-matrix-${{ matrix.browser }}.json
      - name: Retain browser scope, outcomes and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-browser-${{ matrix.browser }}
          path: dist/
          if-no-files-found: warn

  deployed_site:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optional verification after Vercel has deployed this commit
        run: python tools/verify_deployment.py --url https://todo.muquew.com/
