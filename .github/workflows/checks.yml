name: WebKit outcome diagnostics

on:
  push:
    branches: [codex/ci-webkit-outcomes-20261026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-outcome-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install target browser
        run: python -m playwright install --with-deps webkit
      - name: Run all original WebKit programs with safe outcome observer
        run: python -u .github/scripts/webkit_outcomes.py run
      - name: Summarize allowlisted program outcomes
        if: always()
        run: python -u .github/scripts/webkit_outcomes.py summary
      - name: Retain browser scope, outcomes and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-browser-webkit-diagnostic
          path: dist/
          if-no-files-found: warn
