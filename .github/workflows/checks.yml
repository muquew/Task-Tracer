name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_site:
        description: Also verify the already-deployed todo.muquew.com site against this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install accessibility dependency
        run: npm ci --ignore-scripts
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Validate static files, dates, and browser workflows
        run: python tools/check.py --report dist/check-results.json
      - name: Summarize check program outcomes
        if: always()
        run: |
          python - <<'PY'
          import json, math, os, re
          from pathlib import Path

          checks, planned, status, report = [], None, 'missing', {}
          try:
              path = Path('dist/check-results.json')
              if path.is_symlink() or path.stat().st_size > 2_000_000:
                  raise ValueError
              report = json.loads(path.read_text(encoding='utf-8'))
              checks, planned = report['checks'], report['planned_checks']
              if not isinstance(checks, list) or not isinstance(planned, list):
                  raise ValueError
              status = report.get('status', 'invalid')
              if status not in {'initializing', 'running', 'passed', 'failed', 'interrupted', 'error'}:
                  status = 'invalid'
          except FileNotFoundError:
              pass
          except (OSError, ValueError, TypeError, KeyError):
              checks, planned, status, report = [], None, 'invalid', {}

          known = {path.name for path in Path('tools').glob('*.py')
                   if re.fullmatch(r'[a-z][a-z0-9_]{0,79}\.py', path.name)}
          rows, all_zero = [], True
          for item in checks[:100]:
              item = item if isinstance(item, dict) else {}
              program = item.get('program')
              name = Path(program).name if isinstance(program, str) else ''
              name = name if name in known else 'unknown-program'
              code = item.get('exit_code')
              valid_code = type(code) is int and -255 <= code <= 255
              duration = item.get('duration_seconds')
              valid_duration = type(duration) in (int, float) and 0 <= duration <= 86400 and math.isfinite(duration)
              shown_duration = f'{duration:.3f}s' if valid_duration else 'unknown'
              rows.append(f'| `{name}` | {code if valid_code else "unknown"} | {shown_duration} |')
              all_zero = all_zero and valid_code and code == 0 and name != 'unknown-program'
              if valid_code and code != 0:
                  print(f'::error::{name} exit={code}')
          if status == 'passed' and not (report.get('completed') is True and report.get('passed') is True
                  and planned and len(checks) == len(planned) and len(checks) <= 100 and all_zero):
              status = 'incomplete'
          count = f'{len(checks)}/{len(planned)}' if planned is not None else '0/unknown'
          lines = ['## Check program outcomes', '', f'Status: {status}. Executed/planned: {count}.', '',
                   '| Program | Exit | Duration |', '| --- | ---: | ---: |', *rows]
          if len(checks) > 100:
              lines += ['', 'Only the first 100 executed programs are shown.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Retain program outcomes even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-check-results
          path: dist/check-results.json
          if-no-files-found: warn
      - name: Build verified static distribution
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: task-tracer-static
          path: dist/
          if-no-files-found: error

  compatibility:
    runs-on: ubuntu-latest
    # Hosted WebKit exceeded 45 minutes; retain its complete workflow registry.
    timeout-minutes: ${{ matrix.browser == 'webkit' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Install target browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Validate critical workflows on desktop and mobile layouts
        run: python tools/browser_matrix.py --browser ${{ matrix.browser }} --keep-going --report dist/browser-matrix-${{ matrix.browser }}.json
      - name: Summarize browser program outcomes
        if: always()
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import uuid

          _TRACE_MAX_LOG = 1024 * 1024
          _TRACE_MAX_SOURCE = 512 * 1024
          _TRACE_CLASSES = frozenset(('AssertionError', 'TimeoutError', 'Error', 'ValueError',
              'TypeError', 'RuntimeError', 'KeyError', 'OSError', 'PermissionError',
              'FileNotFoundError', 'ImportError', 'ModuleNotFoundError', 'AttributeError',
              'IndexError', 'SyntaxError', 'SystemExit'))
          _TRACE_NAME = re.compile(r'[a-z][a-z0-9_]{0,95}\.py\Z')
          _TRACE_FRAME = re.compile(r'  File "([^"\r\n]{1,512})", line ([1-9][0-9]{0,6}), in ([A-Za-z_][A-Za-z0-9_]{0,127}|<module>)\Z')
          _TRACE_EXCEPTION = re.compile(r'([A-Za-z_][A-Za-z0-9_.]{0,127})(?::[^\r\n]*)?\Z')


          def _trace_read(root_fd, parts, limit):
              """Descriptor-walk fixed components; reject links, special files and excess data."""
              fd = os.dup(root_fd)
              try:
                  for part in parts[:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  file_fd = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
                  try:
                      info = os.fstat(file_fd)
                      if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or not 0 <= info.st_size <= limit:
                          raise ValueError()
                      with os.fdopen(file_fd, 'rb', closefd=False) as stream:
                          data = stream.read(limit + 1)
                      if len(data) != info.st_size or len(data) > limit:
                          raise ValueError()
                      return data
                  finally:
                      os.close(file_fd)
              finally:
                  os.close(fd)


          def get_safe_trace(report_path: Path, report: dict, check: dict) -> dict | None:
              """Only basename/line/function/fixed exception enum; never return raw log data."""
              root_fd = None
              try:
                  repo = Path.cwd().resolve()
                  engine = check.get('browser')
                  if engine not in ('chromium', 'firefox', 'webkit') or report.get('schema_version') != 1:
                      return None
                  expected_report = Path('dist') / f'browser-matrix-{engine}.json'
                  if Path(report_path) not in (expected_report, repo / expected_report):
                      return None
                  run_id = report.get('run_id')
                  parsed_id = uuid.UUID(run_id)
                  if parsed_id.version != 4 or str(parsed_id) != run_id:
                      return None
                  log_root = f'browser-matrix-{engine}-logs'
                  if report.get('log_directory') != f'{log_root}/{run_id}':
                      return None
                  if check not in report.get('checks', []) or check.get('status') != 'failed' or type(check.get('exit_code')) is not int or not check['exit_code']:
                      return None
                  root_fd = os.open('.', os.O_RDONLY | os.O_DIRECTORY)
                  if json.loads(_trace_read(root_fd, list(expected_report.parts), _TRACE_MAX_LOG)) != report:
                      return None
                  verification = report.get('verification', {}).get('files', {})
                  registry_bytes = _trace_read(root_fd, ['tools', 'browser_matrix.py'], _TRACE_MAX_SOURCE)
                  if hashlib.sha256(registry_bytes).hexdigest() != verification.get('tools/browser_matrix.py'):
                      return None
                  registry = ast.parse(registry_bytes)
                  values = [node.value for node in registry.body if isinstance(node, ast.Assign)
                            and any(isinstance(target, ast.Name) and target.id == 'PROGRAMS' for target in node.targets)]
                  programs = ast.literal_eval(values[0]) if len(values) == 1 else ()
                  program = check.get('program')
                  if not isinstance(program, str) or not _TRACE_NAME.fullmatch(program) or program not in programs:
                      return None
                  log = check.get('log', {})
                  filename = f'{engine}-{program[:-3]}.log'
                  if log.get('relative_path') != f'{log_root}/{run_id}/{filename}':
                      return None
                  if type(log.get('bytes')) is not int or not 0 <= log['bytes'] <= _TRACE_MAX_LOG or not re.fullmatch(r'[0-9a-f]{64}', log.get('sha256', '')):
                      return None
                  data = _trace_read(root_fd, ['dist', log_root, run_id, filename], _TRACE_MAX_LOG)
                  if len(data) != log['bytes'] or hashlib.sha256(data).hexdigest() != log['sha256']:
                      return None
                  lines = data.decode('utf-8').splitlines()
                  starts = [i for i, line in enumerate(lines) if line == 'Traceback (most recent call last):']
                  if not starts:
                      return None
                  candidate = None
                  owners = {}
                  for line in lines[starts[-1] + 1:]:
                      match = _TRACE_FRAME.fullmatch(line)
                      if match:
                          raw_path, number, function = match.groups()
                          basename = raw_path.rsplit('/', 1)[-1]
                          if not _TRACE_NAME.fullmatch(basename) or raw_path not in (f'tools/{basename}', str(repo / 'tools' / basename)):
                              continue
                          key = f'tools/{basename}'
                          if key not in verification:
                              continue
                          if basename not in owners:
                              source = _trace_read(root_fd, ['tools', basename], _TRACE_MAX_SOURCE)
                              if hashlib.sha256(source).hexdigest() != verification[key]:
                                  return None
                              tree = ast.parse(source)
                              ast_lines = {node.lineno for node in ast.walk(tree) if hasattr(node, 'lineno')}
                              ownership = {i: '<module>' for i in ast_lines}
                              for node in ast.walk(tree):
                                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.body:
                                      for i in ownership:
                                          if node.body[0].lineno <= i <= node.end_lineno:
                                              ownership[i] = node.name
                              owners[basename] = ownership
                          number = int(number)
                          if owners[basename].get(number) == function:
                              candidate = {'basename': basename, 'line': number, 'function': function}
                          continue
                      if line and not line[0].isspace():
                          exception = _TRACE_EXCEPTION.fullmatch(line)
                          kind = exception.group(1).rsplit('.', 1)[-1] if exception else None
                          if kind not in _TRACE_CLASSES or candidate is None:
                              return None
                          return {**candidate, 'exception_class': kind}
                  return None
              except Exception:
                  return None
              finally:
                  if root_fd is not None:
                      os.close(root_fd)

          def summarize():
              engine = os.environ.get('BROWSER_ENGINE')
              if engine not in ('chromium', 'firefox', 'webkit'):
                  print('::error::browser_matrix.py status=invalid_engine')
                  return
              tree = ast.parse(Path('tools/browser_matrix.py').read_text(encoding='utf-8'))
              programs = next(ast.literal_eval(node.value) for node in tree.body
                              if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name)
                              and target.id == 'PROGRAMS' for target in node.targets))
              if not (isinstance(programs, tuple) and 1 <= len(programs) <= 256
                      and len(set(programs)) == len(programs) and all(isinstance(name, str)
                      and re.fullmatch(r'[a-z][a-z0-9_]{0,79}\.py', name) for name in programs)):
                  print('::error::browser_matrix.py status=invalid_registry')
                  return
              report_path = Path(f'dist/browser-matrix-{engine}.json')
              report, status = {}, 'missing_report'
              try:
                  if Path('dist').is_symlink() or report_path.is_symlink() or report_path.stat().st_size > 2_000_000:
                      raise ValueError
                  report = json.loads(report_path.read_text(encoding='utf-8'))
                  if not isinstance(report, dict):
                      raise ValueError
                  status = report.get('status')
                  if not isinstance(status, str) or status not in {'initializing', 'running', 'passed', 'failed', 'interrupted', 'error'}:
                      status = 'invalid_report'
              except FileNotFoundError:
                  pass
              except (OSError, ValueError, TypeError):
                  report, status = {}, 'invalid_report'
              checks = report.get('checks', [])
              shape_valid = isinstance(checks, list) and len(checks) <= 256
              checks = checks if shape_valid else []
              expected_plan = [{'browser': engine, 'program': name} for name in programs]
              scope = report.get('scope')
              full_scope = (isinstance(scope, dict) and scope.get('browsers') == [engine]
                            and scope.get('programs') == list(programs)
                            and scope.get('registry_program_count') == len(programs)
                            and scope.get('all_registered_programs') is True
                            and report.get('planned_checks') == expected_plan)
              known = set(programs)
              shape_valid = shape_valid and all(isinstance(item, dict) and item.get('browser') == engine
                                               and isinstance(item.get('program'), str) and item['program'] in known
                                               for item in checks)
              rows = []
              for program in programs:
                  matches = [item for item in checks if isinstance(item, dict)
                             and item.get('browser') == engine and item.get('program') == program]
                  item = matches[0] if len(matches) == 1 else None
                  code = item.get('exit_code') if item else None
                  valid_code = type(code) is int and -255 <= code <= 255
                  duration = item.get('duration_seconds') if item else None
                  valid_duration = (type(duration) in (int, float) and 0 <= duration <= 86400
                                    and math.isfinite(duration))
                  state = 'not_run' if not matches else 'invalid'
                  if (item and valid_code and valid_duration
                          and item.get('status') == ('passed' if code == 0 else 'failed')):
                      state = 'passed' if code == 0 else 'failed'
                  rows.append((program, state, code if valid_code else None,
                               f'{duration:.3f}' if valid_duration else 'unknown', item))
              counts = {name: sum(row[1] == name for row in rows) for name in ('passed', 'failed', 'not_run', 'invalid')}
              all_passed = (shape_valid and full_scope and len(checks) == len(programs)
                            and counts['passed'] == len(programs) and report.get('completed') is True
                            and report.get('passed') is True and report.get('source_unchanged') is True
                            and report.get('verification_unchanged') is True and report.get('integrity_errors') == [])
              if status == 'passed' and not all_passed:
                  status = 'incomplete'
              if not shape_valid or (report and not full_scope):
                  status = 'invalid_report'
              header = (f'matrix browser={engine} status={status} passed={counts["passed"]} failed={counts["failed"]} '
                        f'not_run={counts["not_run"]} invalid={counts["invalid"]} planned={len(programs)}')
              print(header)
              lines = [header, '', '| Program | Status | Exit | Duration seconds |', '| --- | --- | ---: | ---: |']
              trace_notes = []
              for program, state, code, duration, item in rows:
                  code_text = str(code) if code is not None else 'unknown'
                  print(f'{program} status={state} exit={code_text} duration={duration}')
                  lines.append(f'| {program} | {state} | {code_text} | {duration} |')
                  if state == 'failed':
                      trace = get_safe_trace(report_path, report, item)
                      detail = ''
                      if trace is not None:
                          location = f'{trace["basename"]}:{trace["line"]}:{trace["function"]}'
                          detail = f' location={location} exception={trace["exception_class"]}'
                          trace_notes.append(f'- `{location}` · `{trace["exception_class"]}`')
                      print(f'::error::{program} exit={code}{detail}')
              if trace_notes:
                  lines.extend(['', 'Safe failure locations:', *trace_notes])
              if status in ('missing_report', 'invalid_report', 'incomplete', 'error', 'interrupted'):
                  print(f'::error::browser_matrix.py status={status}')
              target = os.environ.get('GITHUB_STEP_SUMMARY')
              if target:
                  with open(target, 'a', encoding='utf-8') as stream:
                      stream.write('\n'.join(lines) + '\n')

          try:
              summarize()
          except Exception:
              # Diagnostics must not expose exception messages or replace the original CLI exit result.
              print('::error::browser_matrix.py status=invalid_report')
          PY
      - name: Retain browser scope, outcomes and original logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-browser-${{ matrix.browser }}
          path: dist/
          if-no-files-found: warn

  deployed_site:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optional verification after Vercel has deployed this commit
        run: python tools/verify_deployment.py --url https://todo.muquew.com/
