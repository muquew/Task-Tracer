name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_site:
        description: Also verify the already-deployed todo.muquew.com site against this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install accessibility dependency
        run: npm ci --ignore-scripts
      - name: Verify checked-in stylesheet
        run: npm run styles:check
      - name: Verify checked-in brand assets without a browser
        run: npm run icons:check
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Validate static files, dates, and browser workflows
        run: python -m scripts.check --report dist/check-results.json
      - name: Build verified static distribution
        id: build_distribution
        run: python -m scripts.build_release
      - name: Summarize check program outcomes
        if: always()
        run: python -m scripts.ci_report checks
      - name: Upload verified static distribution
        id: distribution_artifact
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-static
          path: dist/
          if-no-files-found: error
      - name: Retry verified distribution upload
        id: distribution_artifact_retry
        if: ${{ !cancelled() && steps.distribution_artifact.outcome == 'failure' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-static
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Retain program outcomes even when a check fails
        id: check_results_artifact
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-check-results
          path: dist/check-results.json
          if-no-files-found: warn
      - name: Summarize artifact delivery
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_distribution.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution_artifact.outcome }}
          DISTRIBUTION_RETRY_OUTCOME: ${{ steps.distribution_artifact_retry.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.check_results_artifact.outcome }}
        run: python -m scripts.ci_report artifacts

  compatibility:
    runs-on: ubuntu-22.04
    # Hosted WebKit exceeded 45 minutes; retain its complete workflow registry.
    timeout-minutes: ${{ matrix.browser == 'webkit' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install target browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Validate critical workflows on desktop and mobile layouts
        run: python -m scripts.browser_matrix --browser ${{ matrix.browser }} --keep-going --report dist/browser-matrix-${{ matrix.browser }}.json
      - name: Summarize browser program outcomes
        if: always()
        run: python -m scripts.ci_report browser --browser ${{ matrix.browser }}
      - name: Retain browser scope, outcomes and original logs
        id: browser_artifact
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: task-tracer-browser-${{ matrix.browser }}
          path: dist/
          if-no-files-found: warn
      - name: Summarize browser artifact delivery
        if: always()
        env:
          ARTIFACT_OUTCOME: ${{ steps.browser_artifact.outcome }}
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: python -m scripts.ci_report browser-artifact

  deployed_site:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_site }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optional verification after Vercel has deployed this commit
        run: python -m scripts.verify_deployment --url https://todo.muquew.com/
